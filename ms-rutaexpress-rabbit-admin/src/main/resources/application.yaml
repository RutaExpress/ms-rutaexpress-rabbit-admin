server:
  port: 8085

spring:
  application:
    name: ms-rutaexpress-rabbit-admin
  # Clúster: nodos separados por coma (ej: 10.0.1.20:5672,10.0.1.20:5673)
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

logging:
  file:
    name: logs/rabbit-admin.log
